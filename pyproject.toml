[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appliance-energy-forecasting"
version = "0.1.0"
description = "Time-series forecasting of household appliance energy use: benchmarks, SARIMAX, feature-based ML, and a foundation model."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
